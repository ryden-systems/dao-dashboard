# Rebuilds the dashboard every day and publishes it to GitHub Pages.
# A failed build or failed smoke test publishes nothing, so the last good site stays online.
name: Build and publish dashboard

on:
  schedule:
    - cron: "17 3 * * *"   # daily, 03:17 UTC
  workflow_dispatch:        # "Run workflow" button in the Actions tab
  push:
    branches: [main]
    paths: ["site/**", "scripts/**", "config.json", "test/**", ".github/workflows/**"]

permissions:
  contents: write   # commit the updated data/ folder
  pages: write
  id-token: write

concurrency:
  group: dashboard-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build
        run: node scripts/build.mjs
        env:
          # Both optional. Without them the public Solana endpoint is used for everything.
          RPC_URL: ${{ secrets.RPC_URL }}
          SIGNATURES_RPC_URL: ${{ secrets.SIGNATURES_RPC_URL }}

      - name: Tests
        run: npm test

      - name: Commit updated data
        run: |
          git config user.name  "dashboard-bot"
          git config user.email "dashboard-bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "data: update $(date -u +%Y-%m-%d)"
            # main may have moved during this run (a code push, a re-run of an older commit).
            # Replay the data commit on top; the data written by this run wins over older data.
            git pull --rebase -X theirs origin "$GITHUB_REF_NAME"
            git push
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
